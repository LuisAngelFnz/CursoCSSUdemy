<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Practica1</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="hero">
        <nav class="nav">
            <section class="nav__container container">
                <figure class="nav__logo">
                    <h2 class="nav__title">Luis Angel</h2>
                </figure>
                <div class="nav__links">
                    <a href="#" class="nav__link">Inicio</a>
                    <a href="#" class="nav__link">Acerca de</a>
                    <a href="#" class="nav__link">Contacto</a> <!-- Corrección: Contacto -->
                </div>
            </section>
        </nav>

        <section class="hero__main container">
            <div class="hero__texts">
                <h1 class="hero__title">Bienvenido a Luis Angel Design</h1>
                <p class="hero__paragraph">Aprende diseño web moderno, con nuestros cursos gratis o premium</p>
                <a href="#" class="cta">Aprende Ahora</a>
            </div>

            <figure class="hero__picture">
                <!-- Corrección: Se añade el atributo alt -->
                <img src="ilustracion.png" alt="Ilustración de diseño web moderno" class="hero__img">
            </figure>
        </section>
    </header>
</body>
</html>
