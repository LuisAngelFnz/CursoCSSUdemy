<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Practica Formulario</title>
    <link rel="stylesheet" href="../normalize.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <section class="contact">
        <figure class="contact__figure">
            <img src="assets/images/primary-contact.svg" alt="contact" class="contact__img">
        </figure>
        <form action="" class="contact__form">
            <h2 class="contact__title">Estamos en contacto</h2>
            <input type="text" placeholder="Ingresa tu nombre" class="contact__input">
            <input type="email" placeholder="Ingresa tu correo" class="contact__input">
            <textarea placeholder="Mensaje..." class="contact__input contact__input--area"></textarea>
            <button type="submit" class="contact__submit">Enviar ahora</button>
        </form>
    </section>
</body>
</html>
